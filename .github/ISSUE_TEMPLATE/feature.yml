name: Feature or improvement
description: Something new for the site, or a change to how it works.
labels: [enhancement]
body:
  - type: textarea
    id: why
    attributes:
      label: What it's for
      description: Who needs it, and what they're trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the site should do. Mockups, links and examples help.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who it's for
      multiple: true
      options:
        - Visitors
        - Students
        - Reviewers
        - Admins
        - The site team
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: How involved it is; see docs/issue-sizes.md. Not sure? Pick your best guess, and a reviewer will adjust it.
      options:
        - Tier 1 - Quick (about an hour, one file, no database)
        - Tier 2 - Small (a few hours, one page or component, no database change)
        - Tier 3 - Medium (a day or more, several files, may need database changes and tests)
        - Tier 4 - Large (multiple days, or sign-in, permissions or a new feature; start with a plan)
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works, as a checklist.
      value: |
        - [ ] 
